<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title data-i18n="titre">Réserver un Stationnement</title>
        <link rel="stylesheet" href="../css/reservation.css">
    </head>
    <body>
        <div class="booking-card">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px"
            >
                <a href="../index.html" class="btn-back" data-i18n="retour"
                >← Retour à l'accueil</a>
                <button
                    id="btn-langue"
                    onclick="changerLangue()"
                    style="background: #2196f3; border: none; color: white; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: all 0.3s"
                >
                    🇬🇧 English
                </button>
            </div>

            <h2 data-i18n="reserverPlace">Réserver une place</h2>

            <div
                id="cityBadge"
                class="city-badge"
                style="background: #eee; color: #333"
                data-i18n="selectionnerParking"
            >
                Sélectionnez un parking
            </div>

            <form id="bookingForm">
                <div class="form-group">
                    <label for="parkingSelect" data-i18n="parking"
                    >🅿️ Parking</label>
                    <input
                        type="text"
                        id="parkingSearch"
                        placeholder="Rechercher un parking..."
                        data-i18n-placeholder="rechercherParking"
                        autocomplete="off"
                    >
                    <select id="parkingSelect" size="5">
                        <option value="" disabled selected>
                            Chargement des parkings...
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="vehicleType" data-i18n="typeVehicule"
                    >🚗 Type de véhicule</label>
                    <select id="vehicleType">
                        <option value="voiture" data-i18n="voiture">
                            🚗 Voiture
                        </option>
                        <option value="velo" data-i18n="velo">🚴 Vélo</option>
                        <option value="pmr" data-i18n="pmr">
                            ♿ PMR (Personnes à mobilité réduite)
                        </option>
                        <option value="electrique" data-i18n="electrique">
                            ⚡ Véhicule électrique
                        </option>
                    </select>
                </div>

                <div
                    class="form-group"
                    id="borneElectriqueGroup"
                    style="display: none"
                >
                    <label>
                        <input type="checkbox" id="borneElectrique">
                        ⚡ Réserver une borne de recharge électrique
                    </label>
                    <small id="borneInfo" style="color: #666"></small>
                </div>

                <div class="form-group">
                    <label for="vehicleImmat">📝 Immatriculation</label>
                    <input
                        type="text"
                        id="vehicleImmat"
                        placeholder="AB-123-CD"
                        maxlength="20"
                    >
                </div>

                <div class="form-group">
                    <label for="startTime">Arrivée prévue</label>
                    <input type="datetime-local" id="startTime">
                </div>

                <div class="form-group">
                    <label for="endTime">Départ prévu</label>
                    <input type="datetime-local" id="endTime">
                    <div id="dateError" class="error-msg">
                        La date de fin doit être après la date de début.
                    </div>
                </div>

                <div class="notification-section">
                    <h3>🔔 Notifications intelligentes</h3>
                    <div class="notification-option">
                        <label>
                            <input type="checkbox" id="notifEnabled" checked>
                            Activer les rappels
                        </label>
                    </div>
                    <div id="notifOptions" class="notif-options">
                        <label>
                            <input type="checkbox" id="notif30min" checked>
                            ⏰ Rappel 30 minutes avant la fin
                        </label>
                        <label>
                            <input type="checkbox" id="notif1h">
                            ⏰ Rappel 1 heure avant la fin
                        </label>
                        <label>
                            <input type="checkbox" id="notif2h">
                            ⏰ Rappel 2 heures avant la fin
                        </label>
                        <div class="notif-info">
                            <small>📱 Les notifications seront envoyées par SMS
                                et email</small>
                        </div>
                    </div>
                </div>

                <div class="price-summary">
                    <div class="price-row">
                        <span>Durée :</span>
                        <span id="durationDisplay">0h 00m</span>
                    </div>
                    <div class="price-row">
                        <span>Tarif horaire :</span>
                        <span id="rateDisplay">-</span>
                    </div>
                    <div class="total-row">
                        <span>Total estimé :</span>
                        <span id="totalDisplay">0.00 €</span>
                    </div>
                </div>

                <button
                    type="button"
                    id="submitBtn"
                    class="btn-reserve"
                    disabled
                >
                    Confirmer et Payer
                </button>
            </form>
        </div>

        <script src="../js/reservation.js"></script>
        <script src="../js/reservation.translation.js"></script>
    </body>
</html>
