<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parkings Metz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
</head>
<body>

<header>
  <h1>Parkings Metz</h1>
</header>

<div class="search-container">
  <input type="text" id="search" placeholder="Rechercher un parking..." oninput="rechercheParking()">
  <div class="search-buttons">
    <button onclick="localiserUtilisateur()">Ma position</button>
    <button onclick="trierParProximite()">Parking proche</button>
  </div>
  <button id="btn-annuler-itineraire" onclick="supprimerItineraire()" style="display:none">Annuler l'itinéraire</button>
  <button id="btn-stop-guidage" onclick="stopGuidage()" style="display:none">Stop guidage</button>
</div>

<div id="map"></div>

<script type="module" src="map/main.js"></script>

</body>
</html>
