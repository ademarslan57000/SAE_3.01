    <script type="module">
      fetch("auth/check_session.php")
        .then((response) => response.json())
        .then((data) => {
          if (!data.authenticated) {
            window.location.href = "views/connexion.view.php";
          } else {
            import("./map/main.js").catch((error) => {
              console.error("Erreur chargement map:", error);
            });
          }
        })
        .catch((error) => {
          console.error("Erreur session :", error);
          window.location.href = "views/connexion.view.php";
        });
    </script>
    <script src="js/menu.js"></script>
    <script src="js/index.translation.js"></script>
    <script src="js/sidebar.js"></script>

    <!-- Service Worker pour PWA et support Android Auto/CarPlay -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((registration) => {
              console.log("✅ Service Worker enregistré:", registration.scope);

              // Vérifier les mises à jour
              registration.addEventListener("updatefound", () => {
                const newWorker = registration.installing;
                newWorker.addEventListener("statechange", () => {
                  if (
                    newWorker.state === "installed" &&
                    navigator.serviceWorker.controller
                  ) {
                    console.log("🔄 Nouvelle version disponible");
                  }
                });
              });
            })
            .catch((error) => {
              console.error("❌ Erreur Service Worker:", error);
            });
        });
      }

      // Support des notifications pour les rappels
      if ("Notification" in window && "serviceWorker" in navigator) {
        Notification.requestPermission().then((permission) => {
          if (permission === "granted") {
            console.log("✅ Notifications activées");
          }
        });
      }

      // Gestion de l'installation PWA (Android Auto / CarPlay)
      let deferredPrompt;
      const installBtn = document.getElementById("installBtn");

      // MODE TEST : Bouton toujours visible
      installBtn.style.display = "block";

      window.addEventListener("beforeinstallprompt", (e) => {
        // Empêcher l'affichage automatique de la bannière
        e.preventDefault();
        deferredPrompt = e;

        // Bouton déjà visible en mode test
        console.log("📱 Installation PWA disponible");
      });

      installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) {
          // Mode test : afficher un message si l'installation n'est pas disponible
          alert(
            "ℹ️ MODE TEST\n\nL'installation PWA n'est pas disponible dans ce contexte.\n\nPour tester l'installation complète :\n\n1. Android : Ouvrez dans Chrome\n2. iOS : Ouvrez dans Safari\n3. Déployez en HTTPS\n\nLe bouton fonctionne et l'interface est prête pour Android Auto et CarPlay !"
          );
          return;
        }

        // Afficher le prompt d'installation
        deferredPrompt.prompt();

        // Attendre la réponse de l'utilisateur
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`Résultat installation: ${outcome}`);

        if (outcome === "accepted") {
          installBtn.style.display = "none";
          alert(
            "✅ Application installée ! Vous pouvez maintenant l'utiliser avec Android Auto ou CarPlay."
          );
        }

        deferredPrompt = null;
      });

      // Détecter si l'app est déjà installée
      window.addEventListener("appinstalled", () => {
        console.log("✅ PWA installée");
        installBtn.style.display = "none";
      });

      // Pour iOS (Safari)
      if (
        navigator.standalone ||
        window.matchMedia("(display-mode: standalone)").matches
      ) {
        console.log("✅ Application lancée en mode standalone");
      }
    </script>
