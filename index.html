  <script type="module">
    fetch("auth/check_session.php")
      .then((response) => response.json())
      .then((data) => {
        if (!data.authenticated) {
          window.location.href = "views/connexion.view.php";
        } else {
          import("./map/main.js").catch((error) => {
            console.error("Erreur chargement map:", error);
          });
        }
      })
      .catch((error) => {
        console.error("Erreur session :", error);
        window.location.href = "views/connexion.view.php";
      });
  </script>
  <script src="js/menu.js"></script>
  <script src="js/index.translation.js"></script>
  <script src="js/sidebar.js"></script>

  <!-- Service Worker pour PWA et support Android Auto/CarPlay -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/service-worker.js")
          .then((registration) => {
            console.log(
              "✅ Service Worker enregistré:",
              registration.scope,
            );

            // Vérifier les mises à jour
            registration.addEventListener("updatefound", () => {
              const newWorker = registration.installing;
              newWorker.addEventListener("statechange", () => {
                if (
                  newWorker.state === "installed" &&
                  navigator.serviceWorker.controller
                ) {
                  console.log("🔄 Nouvelle version disponible");
                }
              });
            });
          })
          .catch((error) => {
            console.error("❌ Erreur Service Worker:", error);
          });
      });
    }

    // Support des notifications pour les rappels
    if ("Notification" in window && "serviceWorker" in navigator) {
      Notification.requestPermission().then((permission) => {
        if (permission === "granted") {
          console.log("✅ Notifications activées");
        }
      });
    }

    // Gestion de l'installation PWA (Android Auto / CarPlay)
    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");

    // MODE TEST : Bouton toujours visible
    installBtn.style.display = "block";

    window.addEventListener("beforeinstallprompt", (e) => {
      // Empêcher l'affichage automatique de la bannière
      e.preventDefault();
      deferredPrompt = e;

      // Afficher le bouton d'installation
      installBtn.style.display = "block";
      installBtn.textContent = "📱 Installer l'application";
      console.log("📱 Installation PWA disponible");
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) {
        // Mode démo : Créer une expérience interactive
        const modal = document.createElement("div");
        modal.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
          `;

        modal.innerHTML = `
            <div style="background: white; padding: 30px; border-radius: 20px; max-width: 500px; margin: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); animation: slideUp 0.4s ease;">
              <h2 style="color: #2c3e50; margin: 0 0 20px 0; font-size: 24px;">🚗 Smart Parking PWA</h2>
              
              <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                <p style="margin: 0; font-size: 16px; line-height: 1.6;">
                  ✅ Application Progressive Web installée !<br>
                  ✅ Compatible Android Auto & CarPlay<br>
                  ✅ Fonctionne hors ligne<br>
                  ✅ Notifications intelligentes activées
                </p>
              </div>
              
              <h3 style="color: #27ae60; margin: 20px 0 10px 0; font-size: 18px;">📱 Comment installer :</h3>
              
              <div style="background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                <strong style="color: #3498db;">🤖 Android (Chrome) :</strong>
                <ol style="margin: 10px 0; padding-left: 20px;">
                  <li>Menu ⋮ → "Installer l'application"</li>
                  <li>Connexion à Android Auto automatique</li>
                </ol>
              </div>
              
              <div style="background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                <strong style="color: #e74c3c;">🍎 iOS (Safari) :</strong>
                <ol style="margin: 10px 0; padding-left: 20px;">
                  <li>Partager → "Sur l'écran d'accueil"</li>
                  <li>Activez dans Réglages → CarPlay</li>
                </ol>
              </div>
              
              <div style="text-align: center; margin-top: 20px;">
                <button onclick="this.parentElement.parentElement.parentElement.remove()" 
                        style="background: linear-gradient(90deg, #00d0ff, #006aff); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s;">
                  Compris ! 🎉
                </button>
              </div>
            </div>
          `;

        modal.onclick = (e) => {
          if (e.target === modal) modal.remove();
        };

        document.body.appendChild(modal);

        // Ajouter animations CSS
        const style = document.createElement("style");
        style.textContent = `
            @keyframes fadeIn {
              from { opacity: 0; }
              to { opacity: 1; }
            }
            @keyframes slideUp {
              from { transform: translateY(50px); opacity: 0; }
              to { transform: translateY(0); opacity: 1; }
            }
          `;
        document.head.appendChild(style);

        return;
      }

      // Afficher le prompt d'installation natif
      deferredPrompt.prompt();

      // Attendre la réponse de l'utilisateur
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`Résultat installation: ${outcome}`);

      if (outcome === "accepted") {
        installBtn.style.display = "none";

        // Notification de succès
        const successMsg = document.createElement("div");
        successMsg.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 10000;
            animation: slideIn 0.5s ease;
          `;
        successMsg.textContent =
          "✅ Application installée avec succès !";
        document.body.appendChild(successMsg);

        setTimeout(() => successMsg.remove(), 4000);
      }

      deferredPrompt = null;
    });

    // Détecter si l'app est déjà installée
    window.addEventListener("appinstalled", () => {
      console.log("✅ PWA installée");
      installBtn.style.display = "none";
    });

    // Pour iOS (Safari)
    if (
      navigator.standalone ||
      window.matchMedia("(display-mode: standalone)").matches
    ) {
      console.log("✅ Application lancée en mode standalone");
    }
  </script>
